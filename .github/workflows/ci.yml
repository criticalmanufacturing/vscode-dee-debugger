name: CI

on:
  push:
  pull_request:

# Least privilege by default; only the release job needs write (supply-chain
# hardening adopted from the cmf-cli pipeline study — with its gaps fixed:
# actions SHA-pinned, no credentials in logs, tests gate every publish).
permissions:
  contents: read

# Release channel. "--pre-release" packages and publishes the VSIX as a Marketplace
# pre-release and marks the GitHub Release as a prerelease. Set to "" for a stable
# release; the stable version must differ from every published pre-release version.
env:
  VSCE_PRE_RELEASE: "--pre-release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx vsce package --no-dependencies --allow-missing-repository -o cm-dee-debugger.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm-dee-debugger-vsix
          path: cm-dee-debugger.vsix

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version (engines.vscode) and latest stable.
        vscode: ["1.145.0", stable]
    name: e2e (VS Code ${{ matrix.vscode }})
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Version gate: the tag must match package.json — a mismatch would ship a VSIX
      # whose internal version disagrees with the release.
      - name: Assert tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} != package.json $PKG"; exit 1
          fi
      - run: npx vsce package --no-dependencies --allow-missing-repository $VSCE_PRE_RELEASE -o cm-dee-debugger-${{ github.ref_name }}.vsix
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: cm-dee-debugger-*.vsix
          generate_release_notes: true
          prerelease: ${{ env.VSCE_PRE_RELEASE != '' }}

  # Marketplace publish (opt-in): set the repository variable MARKETPLACE_PUBLISH=true
  # once the publisher has a Trusted Publishing policy for this repository, workflow
  # file (ci.yml) and environment (marketplace). Authentication is GitHub OIDC; no
  # token or secret is stored.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && vars.MARKETPLACE_PUBLISH == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write # OIDC token exchanged for a short-lived Marketplace credential
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Publish the exact VSIX attached to the GitHub Release, not a rebuild.
      - name: Download release VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.ref_name }}" -R "${{ github.repository }}" -p 'cm-dee-debugger-*.vsix'
      - name: Publish to Marketplace
        run: npx vsce publish --oidc $VSCE_PRE_RELEASE --packagePath cm-dee-debugger-${{ github.ref_name }}.vsix
