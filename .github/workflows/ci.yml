name: CI

on:
  push:
  pull_request:

# Least privilege by default; only the release job needs write (supply-chain
# hardening adopted from the cmf-cli pipeline study — with its gaps fixed:
# actions SHA-pinned, no credentials in logs, tests gate every publish).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx vsce package --no-dependencies --allow-missing-repository -o dee-debugger.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dee-debugger-vsix
          path: dee-debugger.vsix

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version (engines.vscode) and latest stable.
        vscode: ["1.145.0", stable]
    name: e2e (VS Code ${{ matrix.vscode }})
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Version gate: the tag must match package.json — a mismatch would ship a VSIX
      # whose internal version disagrees with the release.
      - name: Assert tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} != package.json $PKG"; exit 1
          fi
      - run: npx vsce package --no-dependencies --allow-missing-repository -o dee-debugger-${{ github.ref_name }}.vsix
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dee-debugger-*.vsix
          generate_release_notes: true
      # Marketplace publish (opt-in): define the VSCE_PAT repository secret to enable.
      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx vsce publish --packagePath dee-debugger-*.vsix -p "$VSCE_PAT"
          else
            echo "VSCE_PAT not set — skipping marketplace publish."
          fi
