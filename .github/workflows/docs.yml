name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/user-guide/**"
      - docs/requirements.txt
      - docs/puppeteer-config.json
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write # gh-deploy pushes the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install mermaid CLI (mmdc) for diagram pre-rendering
        run: npm install -g @mermaid-js/mermaid-cli
      - name: Install Chromium runtime libraries (for puppeteer/mmdc)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libpango-1.0-0 libcairo2
      - name: Install MkDocs + plugins
        run: pip install -r docs/requirements.txt
      - name: Build (strict — broken nav/links fail the job)
        run: mkdocs build --strict
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
